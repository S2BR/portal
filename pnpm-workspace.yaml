# This is NOT a monorepo workspace. pnpm 11 stores native build-script
# approvals here. These dependencies ship trusted native post-install builds.
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  sharp: true
  # Its postinstall is just an informational notice; the dist is prebuilt, so no build is needed.
  typesense-instantsearch-adapter: false
  unrs-resolver: true
